<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0709">
<title>Blackwood Remote</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<style>
  :root { --bg: #0b0709; --panel: #1a0f12; --line: rgba(201,162,74,.35); --ink: #e9dfd2; --dim: #a39484; --gold: #c9a24a; --blood: #8f1d2c; --ok: #5fd38a; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.4 Georgia, serif; }
  body { padding: 12px 16px calc(24px + env(safe-area-inset-bottom)); }
  header { position: sticky; top: 0; z-index: 2; background: var(--bg); padding: 8px 0 10px; border-bottom: 1px solid var(--line); margin-bottom: 12px; }
  .status { font-size: 13px; color: var(--dim); display: flex; gap: 8px; align-items: center; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--blood); flex: none; }
  .dot.on { background: var(--ok); }
  h1 { font-size: 22px; margin: 6px 0 2px; color: var(--gold); font-weight: normal; }
  .meta { color: var(--dim); font-size: 14px; }
  .timer { font: 44px/1.1 'Courier New', monospace; letter-spacing: 2px; margin-top: 4px; }
  .tally { font-size: 14px; margin-top: 6px; }
  section { margin: 0 0 16px; }
  h2 { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); font-weight: normal; margin: 0 0 8px; }
  .grid { display: grid; grid-template-columns: 1fr; gap: 8px; }
  .grid.small { grid-template-columns: repeat(3, 1fr); }
  button { font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 12px; min-height: 52px; width: 100%; text-align: center; }
  .small button { padding: 10px 6px; min-height: 44px; font-size: 15px; }
  button.primary { background: var(--blood); border-color: #c44; font-size: 19px; }
  button.sent { outline: 2px solid var(--ok); }
  label { display: block; font-size: 15px; margin: 0 0 4px; color: var(--dim); }
  select { width: 100%; font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px; margin-bottom: 10px; }
  .empty, .error { color: var(--dim); padding: 20px 0; text-align: center; }
  .error { color: #f88; }
</style>
</head>
<body>
<header>
  <div class="status"><span class="dot" id="dot"></span><span id="status">Connecting to the laptop…</span></div>
  <h1 id="heading">Blackwood Manor</h1>
  <div class="meta" id="meta"></div>
  <div class="timer" id="timer"></div>
  <div class="tally" id="tally"></div>
</header>
<main id="main"><p class="empty">Waiting for the laptop…</p></main>
<script>
(function () {
  const code = new URLSearchParams(location.search).get('k') || '';
  const $ = (id) => document.getElementById(id);
  const PHASE = { narration: 'Narration', search: 'Reading cards', discussion: 'Discussion', done: 'Stage complete', lastwords: 'Last words' };
  let lastGroups = '', busy = false;

  function el(tag, attrs, ...kids) {
    const n = document.createElement(tag);
    Object.entries(attrs || {}).forEach(([k, v]) => { if (k.startsWith('on')) n.addEventListener(k.slice(2), v); else if (v != null && v !== false) n.setAttribute(k, v); });
    kids.flat().forEach((k) => k != null && n.append(k.nodeType ? k : document.createTextNode(String(k))));
    return n;
  }
  async function send(item, value, btn) {
    if (navigator.vibrate) navigator.vibrate(15);
    if (btn) { btn.classList.add('sent'); setTimeout(() => btn.classList.remove('sent'), 700); }
    try {
      const r = await fetch(`/remote/cmd?k=${encodeURIComponent(code)}`, { method: 'POST', body: JSON.stringify({ id: item.id, label: item.label, value }) });
      if (!r.ok) throw new Error(r.status);
      setTimeout(tick, 400);
    } catch (e) { $('status').textContent = 'Could not send. Check the Wi-Fi.'; }
  }
  function render(s) {
    $('heading').textContent = s.heading || 'Blackwood Manor';
    $('meta').textContent = [s.scene ? `Scene ${s.scene}` : '', s.screen === 'game' ? PHASE[s.phase] || '' : '', s.detail].filter(Boolean).join(' · ');
    $('timer').textContent = s.timer && s.timer !== '--:--' ? s.timer : '';
    $('tally').textContent = s.tally || '';
    const groups = JSON.stringify(s.groups);
    if (groups === lastGroups || (document.activeElement && document.activeElement.tagName === 'SELECT')) return;
    lastGroups = groups;
    const main = $('main');
    main.textContent = '';
    if (!s.groups.length) { main.append(el('p', { class: 'empty' }, 'No buttons on the laptop right now.')); return; }
    s.groups.forEach((g) => {
      const buttons = g.items.filter((i) => i.type === 'button');
      const small = buttons.length > 4 && buttons.every((b) => b.label.length < 14);
      const grid = el('div', { class: 'grid' + (small ? ' small' : '') });
      g.items.forEach((i) => {
        if (i.type === 'select') {
          const sel = el('select', { onchange: (e) => send(i, e.target.value) }, i.options.map((o) => el('option', { value: o.value, selected: o.value === i.value ? 'selected' : null }, o.text)));
          grid.append(el('div', {}, el('label', {}, i.label), sel));
        } else {
          const b = el('button', { class: i.primary ? 'primary' : '', onclick: () => send(i, null, b) }, i.label);
          grid.append(b);
        }
      });
      main.append(el('section', {}, el('h2', {}, g.title), grid));
    });
  }
  async function tick() {
    if (busy) return; busy = true;
    try {
      const r = await fetch(`/remote/state?k=${encodeURIComponent(code)}`, { cache: 'no-store' });
      if (r.status === 403) { $('status').textContent = 'Wrong code: scan the QR code on the laptop\'s setup screen again.'; $('dot').className = 'dot'; return; }
      const j = await r.json();
      const live = j.snapshot && j.age < 4000;
      $('dot').className = 'dot' + (live ? ' on' : '');
      $('status').textContent = live ? 'Connected to the laptop' : 'The laptop is not answering: is the game open there?';
      if (j.snapshot) render(j.snapshot);
    } catch (e) { $('dot').className = 'dot'; $('status').textContent = 'Cannot reach the laptop. Same Wi-Fi?'; }
    finally { busy = false; }
  }
  tick(); setInterval(tick, 700);
})();
</script>
</body>
</html>
